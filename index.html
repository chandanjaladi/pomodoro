<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pomodoro</title>
<meta name="description" content="A focus timer built around a realistic 3D tomato kitchen timer.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#F2F2EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1110" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pomodoro">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<script>
  // Tag the platform before first paint so each device gets its native look.
  (function () {
    var ua = navigator.userAgent, d = document.documentElement;
    var ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var android = /Android/i.test(ua);
    d.classList.add(ios ? "ios" : android ? "android" : "desktop");
    if (ios || android || matchMedia("(pointer: coarse)").matches) d.classList.add("touch");
    if (navigator.standalone || matchMedia("(display-mode: standalone)").matches) d.classList.add("standalone");
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap">
<style>
/* Layout: a single centred column. A glossy 3D tomato kitchen timer, seen from the front and slightly above, sits over a large readout.
   Its top half turns the 0–55 minute band past a fixed pointer on the bottom half. */
:root {
  --bg: #F2F2EE; --bg-hi: #FBFBF8; --ink: #191B1A; --muted: #6C716D; --line: #DDDFD9;
  --tomato: #D2261B;
  --font: "Inter", "Segoe UI", system-ui, sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1110; --bg-hi: #1C1F1D; --ink: #EDEEEA; --muted: #8B908C; --line: #272B28; --tomato: #E0392B; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F1110; --bg-hi: #1C1F1D; --ink: #EDEEEA; --muted: #8B908C; --line: #272B28; --tomato: #E0392B; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: radial-gradient(80% 60% at 50% 38%, var(--bg-hi), var(--bg) 70%); background-color: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }

.stage { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 28px; }
.top { display: flex; justify-content: space-between; align-items: center; }
.brand { font-weight: 600; font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.icons { display: flex; gap: 2px; }

.center { display: grid; place-content: center; justify-items: center; gap: clamp(6px, 1.6vh, 16px); min-height: 0; }
.scene { width: min(86vw, 36vh, 440px); aspect-ratio: 1; max-width: 100%; position: relative; }
.scene canvas { width: 100%; height: 100%; display: block; }
.scene .fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); font-size: .9rem; padding: 24px; }

/* rolling digits */
.time { display: flex; align-items: center; font-weight: 200; font-size: clamp(2.6rem, min(12vw, 8vh), 4.8rem); line-height: 1; letter-spacing: -.045em; font-variant-numeric: tabular-nums; transition: opacity 200ms ease; }
body.paused .time { opacity: .42; }
.slot { position: relative; display: inline-block; overflow: hidden; height: 1.08em; }
.slot .ph { visibility: hidden; }
.slot .d { position: absolute; inset: 0; text-align: center; will-change: transform, opacity; }
.colon { padding: 0 .02em; transform: translateY(-.06em); }
/* readout cell: the minute wheel (before start) and the countdown (while running) share one place and crossfade */
.readout { display: grid; place-items: center; --ih: 34px; min-height: calc(var(--ih) * 5); }
.readout > * { grid-area: 1 / 1; transition: opacity 250ms var(--ease-out), transform 250ms var(--ease-out), filter 250ms var(--ease-out), visibility 0s; }
.readout > .off { opacity: 0; transform: translateY(4px) scale(.98); filter: blur(2px); visibility: hidden; pointer-events: none; transition: opacity 250ms var(--ease-out), transform 250ms var(--ease-out), filter 250ms var(--ease-out), visibility 0s 250ms; }

/* Apple-style minute wheel */
.picker { position: relative; width: 220px; height: calc(var(--ih) * 5); }
.picker .hl { position: absolute; left: 0; right: 0; top: 50%; height: var(--ih); transform: translateY(-50%); border-radius: 12px; background: color-mix(in srgb, var(--ink) 7%, transparent); pointer-events: none; }
.wheel { position: relative; height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none; outline: none;
  -webkit-mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent); mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent); }
.wheel::-webkit-scrollbar { display: none; }
.wheel:focus-visible { outline: none; }
.picker:has(.wheel:focus-visible) .hl { box-shadow: 0 0 0 2px var(--ink); }
.wheel .sp { height: calc(var(--ih) * 2); }
.wheel .it { height: var(--ih); line-height: var(--ih); scroll-snap-align: center; text-align: center; padding-right: 36px; font-size: calc(var(--ih) * .58); font-weight: 400; font-variant-numeric: tabular-nums; color: var(--muted); cursor: pointer; user-select: none; will-change: transform, opacity; }
.wheel .it.sel { color: var(--ink); font-weight: 500; }
.picker .unit { position: absolute; top: 50%; left: calc(50% + 14px); transform: translateY(-50%); font-size: calc(var(--ih) * .46); font-weight: 500; color: var(--ink); pointer-events: none; }
.msg { font-size: .95rem; color: var(--muted); min-height: 1.45em; text-align: center; letter-spacing: .01em; }

/* controls: two groups share one cell and crossfade */
.bottom { display: grid; justify-items: center; gap: 14px; }
.controls { display: grid; place-items: center; min-height: 50px; }
.group { grid-area: 1 / 1; display: flex; gap: 10px; transition: opacity 250ms var(--ease-out), transform 250ms var(--ease-out), filter 250ms var(--ease-out), visibility 0s; }
.group.off { opacity: 0; transform: translateY(4px) scale(.98); filter: blur(2px); pointer-events: none; visibility: hidden; transition: opacity 250ms var(--ease-out), transform 250ms var(--ease-out), filter 250ms var(--ease-out), visibility 0s 250ms; }

button { font: inherit; font-weight: 500; font-size: .95rem; cursor: pointer; border-radius: 999px; padding: 12px 26px; color: var(--ink); background: transparent; border: 1px solid var(--line); position: relative; overflow: hidden; transition: transform 160ms var(--ease-out), border-color 200ms ease, background-color 200ms ease; }
button:active { transform: scale(.97); }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
@media (hover: hover) and (pointer: fine) { button:hover { border-color: var(--muted); } button.icon:hover { color: var(--ink); } }
button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); min-width: 148px; box-shadow: 0 1px 2px rgba(0, 0, 0, .12), 0 10px 24px -12px rgba(0, 0, 0, .45); }
button:not(.primary):not(.icon) { background: color-mix(in srgb, var(--bg-hi) 70%, transparent); }
button.icon { width: 40px; height: 40px; padding: 0; border: 0; display: grid; place-items: center; color: var(--muted); }
button.icon svg { width: 18px; height: 18px; }
button.icon .wave { transition: opacity 200ms ease; }
button.icon[aria-pressed="false"] .wave { opacity: 0; }

/* hold to confirm: slow linear fill while pressed, snappy release */
.hold .overlay { position: absolute; inset: 0; display: grid; place-items: center; background: var(--ink); color: var(--bg); clip-path: inset(0 100% 0 0); transition: clip-path 200ms var(--ease-out); pointer-events: none; }
.hold.holding { transform: scale(.97); }
.hold.holding .overlay { clip-path: inset(0 0 0 0); transition: clip-path 2s linear; }

.tally { display: flex; gap: 6px; align-items: center; min-height: 10px; }
.tally i { width: 8px; height: 8px; border-radius: 50%; background: var(--tomato); }
.tally span { font-size: .75rem; color: var(--muted); letter-spacing: .04em; margin-left: 4px; }

/* quiet chrome while focusing: slow to leave, quick to return */
.fade { transition: opacity 200ms var(--ease-out); }
body.calm .fade { opacity: 0; pointer-events: none; transition: opacity 600ms ease; }
body.calm { cursor: none; }

@media (prefers-reduced-motion: reduce) { .group, .group.off { transform: none; filter: none; } }

/* =====================================================================
   Device layouts
   ===================================================================== */
html { -webkit-text-size-adjust: 100%; }
body { overscroll-behavior: none; }
button, .wheel { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.haptic { display: none; }

/* phones and tablets: native feel, thumb-reachable controls, clear of notches and home indicators */
html.touch body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
html.touch #fs { display: none; }
html.touch .stage { padding-top: max(12px, env(safe-area-inset-top, 0px)); padding-bottom: max(20px, calc(env(safe-area-inset-bottom, 0px) + 10px)); }
html.touch .controls { min-height: 54px; }

/* iPhone / iPad: Human Interface Guidelines. SF Pro, a large title, filled and gray buttons, the Clock app's thin digits */
html.ios { --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif; }
html.ios .brand { font-size: 2.125rem; font-weight: 700; letter-spacing: .01em; text-transform: none; color: var(--ink); }
html.ios .time { font-family: -apple-system, "SF Pro Display", system-ui, sans-serif; font-weight: 200; letter-spacing: -.02em; }
html.ios button:not(.icon) { border: 0; height: 50px; padding: 0 28px; border-radius: 14px; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
/* iPhone buttons use the same colours as the laptop version: ink-filled primary, quiet translucent secondary */
html.ios button.primary { background: var(--ink); color: var(--bg); box-shadow: 0 1px 2px rgba(0, 0, 0, .12), 0 10px 24px -12px rgba(0, 0, 0, .45); min-width: min(72vw, 320px); }
html.ios button:not(.primary):not(.icon) { background: color-mix(in srgb, var(--ink) 9%, transparent); color: var(--ink); min-width: 130px; }
html.ios .hold .overlay { background: var(--ink); color: var(--bg); }
html.ios .picker .hl { border-radius: 9px; background: rgba(118, 118, 128, .14); }
html.ios .wheel .it { font-size: calc(var(--ih) * .6); }
html.ios .picker .unit { font-weight: 600; }
/* on iPhone, a tap on the wheel opens Apple's own picker wheel (real haptic ticks); our wheel mirrors it */
.picker .native { display: none; }
html.ios .picker .native { display: block; position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; opacity: 0; font-size: 16px; -webkit-appearance: none; appearance: none; border: 0; background: transparent; color: transparent; cursor: pointer; }
html.ios .wheel { pointer-events: none; }
html.ios .msg { font-size: 15px; letter-spacing: -.01em; }
html.ios button.icon { width: 44px; height: 44px; color: var(--muted); }

/* Android: Material 3. Roboto, a top app bar title, filled and tonal pill buttons with state layers */
html.android { --font: Roboto, "Google Sans Text", system-ui, sans-serif; }
html.android .brand { font-size: 1.375rem; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--ink); }
html.android .time { font-family: Roboto, system-ui, sans-serif; font-weight: 300; letter-spacing: -.01em; }
html.android button:not(.icon) { border: 0; height: 48px; padding: 0 28px; border-radius: 999px; font-size: 14px; font-weight: 500; letter-spacing: .1px; }
html.android button.primary { background: var(--tomato); color: #fff; box-shadow: none; min-width: min(64vw, 280px); }
html.android button:not(.primary):not(.icon) { background: color-mix(in srgb, var(--tomato) 16%, var(--bg)); color: var(--ink); min-width: 120px; }
html.android button:not(.icon):active { transform: none; box-shadow: inset 0 0 0 999px rgba(255, 255, 255, .12); }
html.android button:not(.primary):not(.icon):active { box-shadow: inset 0 0 0 999px color-mix(in srgb, var(--ink) 10%, transparent); }
html.android .hold .overlay { background: var(--tomato); color: #fff; }
html.android .picker .hl { border-radius: 16px; background: color-mix(in srgb, var(--tomato) 14%, transparent); }
html.android button.icon { width: 48px; height: 48px; }

/* wheel row height stays a whole number of pixels so scroll snapping lands exactly on a row */
@media (max-height: 640px) { .readout { --ih: 30px; } }
@media (min-height: 820px) { .readout { --ih: 40px; } }

/* phones */
@media (max-width: 600px) {
  .scene { width: min(90vw, 40vh); }
  .picker { width: min(240px, 70vw); }
  .bottom { gap: 12px; }
}

/* tablets in portrait: same column, more room */
@media (min-width: 601px) and (orientation: portrait) {
  .scene { width: min(70vw, 44vh, 560px); }
  .readout { --ih: 46px; }
  .time { font-size: clamp(4rem, 9vh, 7rem); }
  .picker { width: 300px; }
}

/* laptops, desktops and tablets in landscape: tomato on the left, the controls panel on the right */
@media (min-width: 900px) and (orientation: landscape) {
  .stage {
    grid-template-columns: minmax(0, 1.15fr) minmax(320px, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto auto minmax(0, 1fr);
    grid-template-areas: "top top" "scene ." "scene readout" "scene msg" "scene bottom" "scene .";
    column-gap: clamp(24px, 4vw, 72px); row-gap: 18px;
    padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); padding-block: 24px 32px;
  }
  .top { grid-area: top; }
  .center { display: contents; }
  .scene { grid-area: scene; place-self: center; width: min(48vw, 74vh, 680px); }
  .readout { grid-area: readout; justify-self: center; --ih: 44px; }
  .time { font-size: clamp(4.5rem, 10vh, 7.5rem); }
  .picker { width: 300px; }
  .msg { grid-area: msg; justify-self: center; text-align: center; }
  .bottom { grid-area: bottom; justify-self: center; justify-items: center; }
  .controls { place-items: center; }
}
</style>
</head>
<body>

<main class="stage">
  <div class="top fade" id="top">
    <div class="brand">Pomodoro</div>
    <div class="icons">
      <button class="icon" id="sound" aria-pressed="false" aria-label="Ticking sound" title="Ticking sound">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8v4h3l4 3V5L6 8H3z"/><path class="wave" d="M13.5 7.5a3.5 3.5 0 010 5M15.5 5a7 7 0 010 10"/></svg>
      </button>
      <button class="icon" id="fs" aria-label="Full screen" title="Full screen">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg>
      </button>
    </div>
  </div>

  <div class="center">
    <div class="scene" id="scene" role="img" aria-label="Tomato kitchen timer"></div>
    <div class="readout">
      <div class="picker" id="picker">
        <div class="hl" aria-hidden="true"></div>
        <div class="wheel" id="wheel" tabindex="0" role="listbox" aria-label="Minutes"></div>
        <span class="unit" aria-hidden="true">min</span>
        <select class="native" id="native" aria-label="Minutes"></select>
      </div>
      <div class="time off" id="time" role="timer" aria-label="Time left"></div>
    </div>
    <div class="msg fade" id="msg">Set a time, then focus on one thing.</div>
  </div>

  <div class="bottom">
    <div class="controls fade" id="controls">
      <div class="group" id="g-idle"><button class="primary" id="start">Start</button></div>
      <div class="group off" id="g-run" inert>
        <button id="pause">Pause</button>
        <button class="hold" id="quit">Hold to reset<span class="overlay" aria-hidden="true">Hold to reset</span></button>
      </div>
    </div>
    <div class="tally fade" id="tally"></div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const DEFAULT_MIN = 55;
  const KEY = "pomodoro-v4";
  const $ = (id) => document.getElementById(id);
  const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const EASE_OUT = "cubic-bezier(0.23, 1, 0.32, 1)";
  const today = () => new Date().toDateString();

  /* ---------- curves ---------- */
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
    return (x) => {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let lo = 0, hi = 1, t = x;
      for (let i = 0; i < 40; i++) { if (sx(t) < x) lo = t; else hi = t; t = (lo + hi) / 2; }
      return sy(t);
    };
  }
  const easeInOut = bezier(0.77, 0, 0.175, 1);
  const easeOut = bezier(0.23, 1, 0.32, 1);

  /* ---------- state ---------- */
  let S = { endAt: null, len: DEFAULT_MIN * 60000, remaining: DEFAULT_MIN * 60000, day: today(), count: 0, tick: false };
  try { Object.assign(S, JSON.parse(localStorage.getItem(KEY)) || {}); } catch {}
  if (S.day !== today()) { S.day = today(); S.count = 0; }
  // every fresh visit starts at 55; a session that is running or paused is restored as it was
  if (!S.endAt && (S.remaining >= S.len || S.remaining <= 0)) { S.len = DEFAULT_MIN * 60000; S.remaining = S.len; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
  const running = () => S.endAt !== null;
  const left = () => (running() ? Math.max(0, S.endAt - Date.now()) : S.remaining);
  const atRest = () => !running() && (S.remaining >= S.len || S.remaining <= 0);
  const fmt = (ms) => { const s = Math.ceil(ms / 1000); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
  let pickMin = DEFAULT_MIN, pickPos = DEFAULT_MIN, zeroHold = false, winding = false;
  // minute that should sit over the pointer: the wheel's live position at rest, the time left while active
  const liveMinutes = () => (atRest() ? (zeroHold ? 0 : pickPos) : left() / 60000);

  /* =====================================================================
     3D tomato
     ===================================================================== */
  const scene3 = { ok: false, needsRender: true };
  (function build3D() {
    const host = $("scene");
    if (!window.THREE) { host.innerHTML = '<div class="fallback">The 3D tomato couldn’t load. The timer still works.</div>'; return; }
    let renderer;
    try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" }); }
    catch { host.innerHTML = '<div class="fallback">3D isn’t available in this browser. The timer still works.</div>'; return; }
    renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1;
    renderer.setClearColor(0x000000, 0);
    host.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
    camera.position.set(0, 1.75, 4.75);
    camera.lookAt(0, -0.2, 0);

    /* studio environment: dark room with soft boxes, so the gloss reflects light the way the product photos do */
    const pmrem = new THREE.PMREMGenerator(renderer);
    const env = new THREE.Scene();
    env.add(new THREE.Mesh(new THREE.BoxGeometry(14, 14, 14), new THREE.MeshBasicMaterial({ color: 0x222222, side: THREE.BackSide })));
    const panel = (w, h, x, y, z, k) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }));
      m.material.color.setScalar(k); m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m);
    };
    panel(6, 3.2, -4.2, 4.5, 3.5, 7);   // key softbox, top left front
    panel(2.2, 6, 5.5, 1.2, 2.5, 3.2);  // tall strip, right
    panel(7, 7, 0, 6.8, 0, 2.2);        // ceiling bounce
    panel(8, 1.6, 0, 0.4, 6.8, 1.6);    // front fill
    panel(8, 4, 0, -6.5, 0, 0.9);       // floor bounce
    scene.environment = pmrem.fromScene(env, 0.035).texture;
    const key = new THREE.DirectionalLight(0xffffff, 0.9); key.position.set(-3, 5, 4); scene.add(key);

    /* ---- body profile (x = radius, y = height), bottom pole to top dimple ---- */
    const SY = 1.2; // the real timer is about as tall as it is wide
    const V = (x, y) => new THREE.Vector2(x, y);
    const VP = (x, y) => new THREE.Vector2(x, y * SY);
    const prof = new THREE.SplineCurve([
      VP(0, -0.80), VP(0.30, -0.80), VP(0.58, -0.76), VP(0.80, -0.64), VP(0.95, -0.44), VP(1.02, -0.20), VP(1.02, 0.02),
      VP(0.97, 0.24), VP(0.86, 0.43), VP(0.68, 0.58), VP(0.45, 0.665), VP(0.24, 0.655), VP(0.08, 0.615), VP(0, 0.60),
    ]).getSpacedPoints(520);
    const YS = -0.22 * SY, GAP = 0.006;          // seam height and half-gap
    let iSeam = prof.findIndex((p) => p.y >= YS);
    const xAtY = (y) => { for (let i = 1; i < iSeam + 40; i++) if (prof[i].y >= y) { const a = prof[i - 1], b = prof[i], t = (y - a.y) / (b.y - a.y); return a.x + (b.x - a.x) * t; } return 1; };
    const XS = xAtY(YS);

    /* lobes: seven soft ribs on the upper half, with creases dipping toward the calyx */
    const sm = (a, b, v) => { const t = Math.min(1, Math.max(0, (v - a) / (b - a))); return t * t * (3 - 2 * t); };
    function lobeShape(r, y, phi) {
      const lobe = Math.pow(Math.abs(Math.cos(3.5 * phi)), 0.55);
      const vary = 1 + 0.18 * Math.sin(2 * phi + 1.3);

      const to = seg.to === null ? liveMinutes() : seg.to;
      mDisp = tween.from + (to - tween.from) * seg.ease(x);
      if (x >= 1) { tween.i++; tween.from = mDisp; tween.t0 = now; if (tween.i >= tween.segs.length) { const d = tween.done; tween = null; d && d(); } }
      const whole = Math.floor(mDisp);
      if (whole !== lastWhole) { lastWhole = whole; click(); }
    } else { mDisp = liveMinutes(); lastWhole = Math.floor(mDisp); }

    if (scene3.ok) {
      const a = -mDisp * Math.PI / 30; // 6° per minute
      if (Math.abs(a - scene3.top.rotation.y) > 1e-6) { scene3.top.rotation.y = a; scene3.needsRender = true; }
      if (glow !== null) {
        const x = (now - glow) / 1800;
        scene3.renderer.toneMappingExposure = 1 + 0.32 * Math.pow(Math.sin(Math.PI * Math.min(1, x)), 2);
        scene3.needsRender = true;
        if (x >= 1) { glow = null; scene3.renderer.toneMappingExposure = 1; }
      }
      if (scene3.needsRender) { scene3.renderer.render(scene3.scene, scene3.camera); scene3.needsRender = false; }
    }

    const str = winding ? fmt(S.len) : atRest() ? (S.remaining <= 0 && zeroHold ? "00:00" : fmt(pickMin * 60000)) : fmt(left());
    showTime(str, true);
    if (running()) {
      const sec = Math.ceil(left() / 1000);
      if (sec !== lastSec) { lastSec = sec; if (S.tick) tick(); }
      document.title = str + " · Pomodoro";
    } else document.title = "Pomodoro";
    requestAnimationFrame(frame);
  }

  /* ---------- quiet chrome while focusing ---------- */
  let calmT;
  function poke() {
    document.body.classList.remove("calm"); clearTimeout(calmT);
    if (running()) calmT = setTimeout(() => { if (running() && !q.classList.contains("holding")) document.body.classList.add("calm"); }, 3000);
  }
  ["pointermove", "pointerdown", "keydown"].forEach((e) => addEventListener(e, poke, { passive: true }));

  /* ---------- hold to reset ---------- */
  const q = $("quit"), overlay = q.querySelector(".overlay");
  const holdOn = (e) => { if (e) e.preventDefault(); q.classList.add("holding"); };
  const holdOff = () => q.classList.remove("holding");
  q.addEventListener("pointerdown", (e) => { q.setPointerCapture?.(e.pointerId); holdOn(e); });
  ["pointerup", "pointercancel", "lostpointercapture"].forEach((e) => q.addEventListener(e, holdOff));
  q.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && !e.repeat) holdOn(e); });
  q.addEventListener("keyup", (e) => { if (e.key === "Enter" || e.key === " ") holdOff(); });
  q.addEventListener("click", (e) => e.preventDefault());
  overlay.addEventListener("transitionend", (e) => { if (e.propertyName === "clip-path" && q.classList.contains("holding")) { holdOff(); haptic(true); reset(); } });

  /* ---------- wiring ---------- */
  $("start").onclick = start;
  $("pause").onclick = () => (running() ? pause() : start());
  const snd = $("sound");
  snd.setAttribute("aria-pressed", S.tick);
  snd.onclick = () => { S.tick = !S.tick; snd.setAttribute("aria-pressed", S.tick); save(); if (S.tick) tick(); };
  $("fs").onclick = () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch {} };
  addEventListener("keydown", (e) => {
    if (e.code !== "Space" || e.target.tagName === "BUTTON") return;
    e.preventDefault(); running() ? pause() : start();
  });
  setInterval(() => {
    if (S.day !== today()) { S.day = today(); S.count = 0; save(); render(); }
    if (running() && left() <= 0) complete();
  }, 200);

  /* ---------- first paint ---------- */
  if (running() && left() <= 0) complete();
  if (running()) wake(true);
  showTime(atRest() ? fmt(pickMin * 60000) : fmt(left()), false);
  if (!atRest()) say(running() ? "Focus. Everything else can wait." : "Paused.");
  // home-screen shortcuts open "./?min=25&start=1" and friends
  const params = new URLSearchParams(location.search);
  const qMin = Math.round(Number(params.get("min")));
  const startMin = qMin >= 1 && qMin <= 55 && atRest() ? qMin : DEFAULT_MIN;
  if (params.has("min") || params.has("start")) history.replaceState(null, "", location.pathname);
  placeWheel(startMin); pickPos = startMin; mDisp = startMin;
  setTimeout(() => (ignoreScroll = false), 120);
  render(); requestAnimationFrame(frame);
  if (params.get("start") === "1" && atRest() && startMin >= 1) setTimeout(start, 400);

  // offline support and "Add to Home Screen"
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }

  // entrance, once per visit: the tomato leads, the readout and controls follow on shrinking gaps, chrome only fades
  const enter = (el, delay, dist, dur) => el.animate(
    RM ? [{ opacity: 0 }, { opacity: 1 }]
       : [{ opacity: 0, transform: `translateY(${dist}px) scale(${dist > 10 ? 0.97 : 1})` }, { opacity: 1, transform: "none" }],
    { duration: dur, delay, easing: EASE_OUT, fill: "backwards" });
  enter($("scene"), 0, 16, 700);
  enter(timeEl, 90, 8, 600);
  enter(msgEl, 150, 6, 500);
  enter($("controls"), 190, 6, 500);
  [$("top"), $("tally")].forEach((el) => el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 400, easing: "ease", fill: "backwards" }));
})();
</script>
</body>
</html>
